---
 - name: error handling
   connection: local
   hosts: local
   tasks:
   - name: check user not
     ansible.builtin.command: id roboshop
     register: user_output
     ignore_errors: true

   - name: print user_output
     ansible.builtin.debug:
      msg: "{{user_output }}"

   - name: add user
     ansible.builtin.command: useradd roboshop
     when: user_output.rc != 0   
    
