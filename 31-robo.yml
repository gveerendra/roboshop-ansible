---
 - name: robo project
   connection: local
   hosts: local
   vars:
    sg_id: sg-0908ae41df2b24715
    ami_id: ami-0055977a6e828a4f4 
    env: dev
    instances:
    - mongodb
    - catalogue
   tasks:
   - name: create ec2 instance
     amazon.aws.ec2_instance:
      instance_type: "t3.micro"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      name: "{{ item }}-{{ env }}"
      tags:
       Project: robo
       Component: "{{ item }}"
       name: "{{ item }}-{{ env }}"
     loop: "{{ instances }}"
     register: ec2_output
   - name: print the output  
     ansible.builtin.debug:
      msg: "{{ ec2-output }}"
      
     
  