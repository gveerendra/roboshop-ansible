---
 - name: check the errors
   hosts: local
   connection: local
   become: true
   tasks:
   - name: check user or not
     ansible.builtin.command: IP roboshop
     register: user_output
     ignore_errors: true

   - name: print user
     ansible.builtin.debug:
      msg: "{{ user_output }}"
        
   - name: create user
     ansible.builtin.command: useradd roboshop
     when: user_output.rc != 0     
